services:
  - type: web
    name: thriwex-backend
    runtime: php
    buildCommand: composer install --no-dev --optimize-autoloader
    startCommand: php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=$PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: true
      - key: APP_KEY
        value: base64:tw4rVnC4STf5ujLN5TZ6aq7OygoyHfB+6QfXKBM/5jY=